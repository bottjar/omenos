# OmenOS — zram sebagai swap (tanpa partisi swap).
# Unit ini 16 GB dalam satu keping (slot 2 saja, single-channel), jadi bandwidth
# memori separuh dari konfigurasi dua keping. zram membantu saat compile/build
# tanpa menyentuh disk; dibatasi 8 GB agar tidak memakan RAM berlebihan.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
