# OmenOS — pengaturan NVIDIA (hybrid graphics)
# Dibaca oleh driver proprietary maupun nvidia-open.

# Wayland + Xorg butuh modeset agar KMS bekerja sebelum display manager.
options nvidia_drm modeset=1 fbdev=1

# Simpan VRAM saat suspend agar tidak crash setelah resume (Omen sering kena).
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp

# Runtime D3 power management hanya didukung Turing ke atas. GPU Pascal (15-dc)
# tidak memakainya; 0x00 mencegah hang saat idle/suspend.
options nvidia NVreg_DynamicPowerManagement=0x00
