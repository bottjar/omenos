# OmenOS — audio 15-dc00036tx (Realtek ALC295, subsystem 103c:84da)
#
# ALC295 di seri ini mengeluarkan bunyi "pop"/klik saat codec masuk mode hemat
# daya (kejadian setiap kali audio idle beberapa detik). Karena laptop ini
# dipakai dengan speaker internal, pop jauh lebih mengganggu daripada ~0,2 W
# yang dihemat, jadi runtime power save dimatikan.
options snd_hda_intel power_save=0 power_save_controller=N
