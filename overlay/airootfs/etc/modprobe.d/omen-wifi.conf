# OmenOS — Wi-Fi 15-dc00036tx (Intel Wireless-AC 9560, 8086:a370)
#
# 9560 memakai iwlwifi + firmware dari linux-firmware (tidak ada paket tambahan).
# Power save iwlwifi di seri ini sering membuat latensi melonjak dan sesi SSH
# putus saat menganggur — justru mengganggu pada skenario uji remote OmenOS.
# Dibayar dengan ~0,3-1 W; bisa diaktifkan lagi lewat:
#   echo 'options iwlwifi power_save=1' > /etc/modprobe.d/omen-wifi.conf
options iwlwifi power_save=0 bt_coex_active=1
