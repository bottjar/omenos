# OmenOS — zram sebagai swap utama.
#
# zram (lihat /etc/systemd/zram-generator.conf) hanya berguna kalau kernel
# benar-benar memilihnya dibanding membuang page cache. Default Arch 60 terlalu
# konservatif untuk zram: halaman anonim ditekan ke kompresi RAM jauh lebih
# murah daripada memuat ulang file dari NVMe 128 GB yang juga dipakai sistem.
#
# 100 = agresif memakai zram. Aman di unit ini karena zram tidak menyentuh
# disk (tidak ada aus flash) dan ukurannya dibatasi min(ram/2, 8 GiB).
vm.swappiness = 100

# Sedikit lebih sabar membuang dentry/inode bila RAM mulai penuh, supaya
# cache filesystem tidak langsung hilang saat compile besar.
vm.vfs_cache_pressure = 50
