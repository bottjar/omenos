# OmenOS — kurva fan (default untuk OMEN 15-dc00036tx, board 84DB)
#
# Suhu acuan = maksimum dari coretemp / nvidia (CPU i7-8750H, GPU GTX 1060/1070 Max-Q).
#
# PENTING untuk 15-dc0000:
#   hp-wmi di model ini hanya punya dua keadaan: AUTO (EC) atau MAX (boost).
#   Tergantung versi kernel, file yang ada bisa `pwm1_enable` saja (kernel
#   lama), atau `pwm1` + `pwm1_enable` (kernel baru). Keduanya ditangani.
#   Tidak ada `pwm1_max` -> tidak bisa diatur persen.
#   Karena itu `omen-control` memakai backend "pwm-boost" dan bagian `curve`
#   di bawah TIDAK dipakai — yang dipakai adalah boost_on_c / boost_off_c
#   dengan histeresis supaya fan tidak berkedip on/off.
#   Kalau kernel benar-benar tidak mengekspos PWM sama sekali (hp-wmi baru
#   hanya mendaftarkan hwmon untuk model dengan tabel fan), backend menjadi
#   "platform-profile" dan profil termal yang dipakai untuk mendinginkan.
#   `curve` tetap berguna kalau nanti Anda memasang driver PWM manual.

interval_s      = 5    # detik antar evaluasi (EC Omen bisa me-reset state sendiri)
hysteresis_c    = 3    # untuk backend PWM manual: abaikan perubahan target < 3%

# --- keamanan (semua backend)
# i7-8750H Tjmax 100 C; 93 C sudah cukup panas untuk memaksa pendinginan penuh.
safety_temp_c   = 93
safety_release_c = 87  # di bawah ini fan kembali ke kontrol normal

# --- backend pwm-boost (15-dc0000 / 84DA / 84DB)
# Boost ON di 76 C, OFF di 68 C. Selisih 8 C mencegah fan menyala-mati terus
# saat suhu melayang di sekitar ambang (mis. saat compile atau main game ringan).
boost_on_c      = 76
boost_off_c     = 68

# --- backend platform-profile (kalau hp-wmi hanya mengekspos profil termal)
perf_c          = 82   # >= ini -> performance
quiet_c         = 58   # <= ini -> low-power/quiet

# --- backend pwm-manual (driver komunitas dengan PWM penuh)
curve = [
  [ 45, 22 ],
  [ 55, 32 ],
  [ 65, 45 ],
  [ 75, 62 ],
  [ 82, 80 ],
  [ 88, 95 ],
  [ 92, 100 ],
]
