# Pilihan driver NVIDIA untuk omen-setup (dibaca kalau tidak ada --nvidia=).
#
#   auto    deteksi otomatis: Pascal/Maxwell/Volta -> 580xx, Turing+ -> open
#   legacy  paksa nvidia-580xx-dkms (AUR)
#   open    paksa nvidia-open-dkms (repo resmi, Turing ke atas)
#   none    jangan pasang driver proprietary; nouveau/Intel dibiarkan
#
# File ini ditulis oleh omen-install --nvidia=<mode>; bisa juga diedit manual.
MODE=auto
