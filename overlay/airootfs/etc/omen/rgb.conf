# OmenOS — keyboard RGB (OMEN 15-dc00036tx, 4 zona)
#
# Unit ini mengikuti keyboard 4 zona seri 15-dc0000, tetapi jumlah zona fisik
# baru pasti setelah dicek di hardware: `ls /sys/class/leds | grep -i kbd`
# (TUXOV: -wasd/-left/-center/-right) atau `ls /sys/devices/platform/hp-wmi/rgb_zones`.
# Kalau ternyata zona tunggal, `omen-control rgb set <warna> <zona>` akan menolak
# indeks > 0 dan warna berlaku untuk seluruh keyboard.
#
# Dua backend mungkin muncul, isi file ini berlaku untuk keduanya:
#   zones : /sys/devices/platform/{hp-wmi,omen-rgb-keyboard}/rgb_zones/zone00..03
#           (driver komunitas; mendukung efek/animasi)
#   leds  : /sys/class/leds/hp::kbd_backlight*/multi_intensity
#           (hp-wmi bawaan kernel >= 7.0; hanya warna statis per zona)
#
# zones: satu entri per zona kiri->kanan. String kosong = pakai `color`.

effect          = "static"     # static | breathing | rainbow | wave | off (zones saja)
color           = "FF3B30"     # OMEN red
brightness      = 80           # 0-100
animation_speed = 5            # 1-10 (zones saja)

# 4 zona: kiri (WASD), tengah-kiri, tengah-kanan, kanan (arrow/numpad)
zones = ["FF3B30", "", "", ""]
