<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="base" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#2a0007"/>
      <stop offset="0.42" stop-color="#12080d"/>
      <stop offset="1" stop-color="#060608"/>
    </radialGradient>
    <linearGradient id="shard" gradientUnits="userSpaceOnUse" x1="-100" y1="-100" x2="100" y2="100">
      <stop offset="0" stop-color="#ff3a4c"/>
      <stop offset="0.45" stop-color="#e00012"/>
      <stop offset="1" stop-color="#780007"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e00012" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e00012" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- Garis diagonal halus: kesan sasis gaming, tidak mengganggu ikon desktop. -->
  <g stroke="#e00012" stroke-width="1.4" opacity="0.07">
    <path d="M-200 980 L820 -100"/>
    <path d="M-80 1040 L940 -40"/>
    <path d="M40 1100 L1060 20"/>
    <path d="M1520 1180 L2060 640"/>
    <path d="M1620 1180 L2120 680"/>
  </g>

  <!-- Mark besar samar di kanan. -->
  <g transform="translate(1600 300) scale(2.7)" opacity="0.10" fill="url(#shard)">
    <path d="M12 -88 L88 -12 L47.52 -6.48 L6.48 -47.52 Z"/>
    <path d="M88 12 L12 88 L6.48 47.52 L47.52 6.48 Z"/>
    <path d="M-12 88 L-88 12 L-47.52 6.48 L-6.48 47.52 Z"/>
    <path d="M-88 -12 L-12 -88 L-6.48 -47.52 L-47.52 -6.48 Z"/>
  </g>

  <!-- Mark utama. -->
  <g transform="translate(960 372) scale(2.05)" fill="url(#shard)">
    <path d="M12 -88 L88 -12 L47.52 -6.48 L6.48 -47.52 Z"/>
    <path d="M88 12 L12 88 L6.48 47.52 L47.52 6.48 Z"/>
    <path d="M-12 88 L-88 12 L-47.52 6.48 L-6.48 47.52 Z"/>
    <path d="M-88 -12 L-12 -88 L-6.48 -47.52 L-47.52 -6.48 Z"/>
  </g>

  <text x="960" y="706" text-anchor="middle" fill="#f5f5f7"
        font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="92" font-weight="bold"
        letter-spacing="26">OMENOS</text>
  <text x="960" y="758" text-anchor="middle" fill="#96969f"
        font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18"
        letter-spacing="9">OMEN 15 &#183; ARCH LINUX</text>

  <!-- Aksen bawah. -->
  <rect x="820" y="836" width="280" height="3" rx="1.5" fill="url(#fade)"/>
  <text x="960" y="900" text-anchor="middle" fill="#5e5e68"
        font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12"
        letter-spacing="6">PERFORMA &#183; KONTROL &#183; KEBEBASAN</text>
</svg>
